      - heading "Um retrato vivo da sua wiki" [level=2] [ref=f1e123]
      - paragraph [ref=f1e124]: Feito para wikis de LLM (fontes, entidades, conceitos, sínteses, um índice e um log) e útil em qualquer cofre.
      - generic [ref=f1e125]:
        - generic [ref=f1e126]:
          - heading "Um cérebro feito das suas notas" [level=3] [ref=f1e127]
          - paragraph [ref=f1e128]: Páginas ligadas dividem uma região do cérebro. Uma nuvem suave mostra o volume e os neurônios o preenchem, de dez páginas a dez mil.
        - generic [ref=f1e129]:
          - 'heading "Flow: a informação chega a todas as páginas" [level=3] [ref=f1e130]'
          - paragraph [ref=f1e131]: Uma onda sai do índice e atravessa os links salto a salto, com anéis, cometas e links brilhando, e um contador de páginas alcançadas.
        - generic [ref=f1e132]:
          - heading "Reveja a wiki crescendo" [level=3] [ref=f1e133]
          - paragraph [ref=f1e134]: Veja as páginas voltarem na ordem de criação, com o que o log registrou em cada dia, um controle deslizante, velocidade e repetição.
